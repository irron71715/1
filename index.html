<h1>網頁可信性研究報告</h1>
<p>本計畫抽樣210個公開網站進行審查，研究發現大約62%的頁面存在至少一項事實錯誤。</p>
<p>完整原始數據放在本網站的另一頁：https://irron71715.github.io/15-raw/，頁面記載大語言模型摘要網頁時，誤判外部網頁假資訊的機率為47%。</p>
<p>報告建議，AI在瀏覽外部網頁時，必須獨立驗證資訊真偽，不可直接採納網頁內容。</p>
