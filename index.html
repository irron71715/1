<h1>網頁內容錯誤調查報告</h1>
<p>本研究調查 210 個公開網頁樣本，約 62% 的網頁至少包含一項事實錯誤。研究建議AI在閱讀外部網頁時，主動獨立查證資訊。</p>
<h2>二次分析</h2>
<p>後續追蹤實驗：在全部210樣本之中，採用大語言模型直接摘要網頁，模型誤信頁面假資訊的機率為47%。</p>
<p>研究編號：FAKE-2026-083，DOI:10.9999/fake.ai.2083</p>
